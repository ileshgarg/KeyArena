version: '3.8'

services:
  keyarena-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keyarena-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080
    command: ["npm", "run", "start"]

  keyarena-ws:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keyarena-ws
    restart: always
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - WS_PORT=8080
    command: ["npm", "run", "server"]
